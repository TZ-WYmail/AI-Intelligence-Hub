[project]
name = "ai-intelligence-hub"
version = "0.1.0"
description = "Persistent multi-industry intelligence collection and analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "feedparser>=6,<7",
    "apscheduler>=3.11,<4",
    "pyyaml>=6,<7",
    "streamlit>=1.66,<2",
    "beautifulsoup4>=4.12,<5",
    "plotly>=6,<8",
    "numpy>=1.26,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
